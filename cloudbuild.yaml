# W1-12  Cloud Build: build both images and deploy them to Cloud Run.
#
# Triggered on a push to the deploy branch. The API is deployed first because
# the web bundle needs its URL at BUILD time — NEXT_PUBLIC_* values are inlined
# into the client JavaScript and are not read at runtime.
substitutions:
  _REGION: asia-south1
  _REPO: workforce
  _BACKEND: wf-api
  _FRONTEND: wf-web
  _CONNECTOR: wf-connector
  _ALLOWED_DOMAIN: katbotz.com
  _GOOGLE_CLIENT_ID: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # ---------------- API ----------------
  - id: build-api
    name: gcr.io/cloud-builders/docker
    dir: backend
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_BACKEND}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_BACKEND}:latest
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_BACKEND}']
    waitFor: [build-api]

  # WF_DEV_LOGIN is deliberately absent, so the dev-only sign-in route does not
  # exist in a deployed environment. Do not add it here.
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_BACKEND}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_BACKEND}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --vpc-connector=${_CONNECTOR}
      - --vpc-egress=private-ranges-only
      - --set-secrets=DATABASE_URL=wf-database-url:latest,SESSION_SECRET=wf-session-secret:latest,DOCUMENTS_BUCKET=wf-documents-bucket:latest
      - --set-env-vars=ALLOWED_DOMAIN=${_ALLOWED_DOMAIN},GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}
      - --min-instances=0
      - --max-instances=4
      - --allow-unauthenticated
    waitFor: [push-api]

  # ---------------- Web ----------------
  - id: api-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services describe ${_BACKEND} --region ${_REGION} \
          --format='value(status.url)' > /workspace/api_url.txt
        echo "API is at $(cat /workspace/api_url.txt)"
    waitFor: [deploy-api]

  - id: build-web
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        API_URL="$(cat /workspace/api_url.txt)"
        docker build \
          --build-arg NEXT_PUBLIC_API_BASE_URL="$$API_URL" \
          --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID="${_GOOGLE_CLIENT_ID}" \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND}:$SHORT_SHA \
          -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND}:latest \
          frontend
    waitFor: [api-url]

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND}']
    waitFor: [build-web]

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONTEND}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=0
      - --max-instances=4
      - --allow-unauthenticated
    waitFor: [push-web]

  # The API only accepts browser requests from an origin it knows, so its CORS
  # setting is updated once the web URL exists.
  - id: link-cors
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        WEB_URL="$(gcloud run services describe ${_FRONTEND} --region ${_REGION} --format='value(status.url)')"
        gcloud run services update ${_BACKEND} --region ${_REGION} \
          --update-env-vars "FRONTEND_ORIGIN=$$WEB_URL"
        echo "FRONTEND_ORIGIN set to $$WEB_URL"
    waitFor: [deploy-web]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_BACKEND}:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_FRONTEND}:latest
timeout: 1800s
